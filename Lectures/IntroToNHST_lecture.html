### Formulating a Model

+ **Model:** a formal representation of the way the world works

  + Your expectations around your construct of interest
  
  + When you make a hypothesis, you're proposing a model


--

.center[
&lt;img src="images/Hypotheses.png" width="75%" /&gt;
]


---
### Assessing Evidence

+ Remember, in Psychology we rely on empirical evidence

+ We gather data and see how well it aligns with our proposed model.

  + If our model does not fit the data, we presume the null hypothesis is correct (for the time being)

  + If the model fits the data well, we reject the null hypothesis and go with the alternative

### Testing the Model

+ Statistics provide a way of testing your proposed model.

+ Null-hypothesis statistical tests of significance assess strength of the evidence against the null hypothesis using **probability**

   + NHSTs evaluate the likelihood that the null hypothesis is true given the observed data

--
   
   + The burden of proof is on the alternative hypothesis
   
      + If the observed data is statistically unlikely to occur under the null hypothesis, this is sufficient evidence to reject it 
      + If the observed data is statistically likely to occur under the null hypothesis, it is not rejected, because the evidence is insufficient.

### Null Distributions

+ The distribution against which the the results are evaluated is known as the **null distribution**.

+ Each statistical test is associated with its own null distribution

+ The null distribution is the probability distribution of a statistic **given that the null hypothesis is true**. 



---

### Comparing Results to Null Distribution

+ Conducting a statistical test involves:

  1. Computing a test statistic based on the data
  
  2. Calculating the probability of obtaining this statistic if the null were true
  
  3. Using this probability to make a decision whether to reject the null hypothesis.
  
  + &lt;span style = "font-size:10pt"&gt; (Don't panic - most of this is done automatically using statistical software.) &lt;/span&gt;

## Questions?

---
### `\(p\)` - values

.pull-left[
+ The `\(p\)`-value is the **probability** of obtaining data at least as extreme as ours, given that the null hypothesis is true.

+ It is not:
  + The likelihood that the null hypothesis is true.
  + The likelihood that our hypothesis is false
]

---
count: false

### `\(p\)` - values

.pull-left[
+ The `\(p\)`-value is the **probability** of obtaining data at least as extreme as ours, given that the null hypothesis is true.

+ It is not:
  + The likelihood that the null hypothesis is true.
  + The likelihood that our hypothesis is false

+ It provides insight into the strength of our evidence against the null hypothesis. 

+ If `\(p\)`-value passes a specific threshold, we consider our results to be **significant**, and `\(H_0\)` is rejected.

]

--

.pull-right[
![](IntroToNHST_lecture_files/figure-html/unnamed-chunk-36-1.svg)&lt;!-- --&gt;
]


---

### `\(\alpha\)`

+ The 'threshold' for significance is known as alpha, `\(\alpha\)`

+ If the `\(p\)`-value is less than the predetermined `\(\alpha\)` threshold, the null hypothesis is rejected

+ But what, exactly, does `\(\alpha\)` reflect?

---
### Errors

+ Whether the decision is made to reject or not reject the null hypothesis, you may be making an error.

+ Basically, what you find in your sample isn't actually what is true of the population.

--

+ Two types of errors:

  + **Type I Error:** You reject a true null hypothesis (i.e. you suggest there is an effect or an association when there really isn't)
  
  + **Type II Error:** You don't reject a false null hypothesis (i.e. you don't find an effect or association that actually exists)

---
### `\(\alpha\)`

+ `\(\alpha\)` reflects the probability of making a Type I error

+ It is the likelihood of rejecting the null when it is actually true.
  
+ You choose your desired `\(\alpha\)` value before you run any analyses. 

  + The most commonly used `\(\alpha\)` is .05, but may sometimes be set at .01 or .001.
  
  + If `\(\alpha\)` is set at .05, it means there is a 5% risk of rejecting the null hypothesis when it shouldn't be rejected. 

---
class: center, inverse, middle

## Questions?
---
### One-Tailed vs Two-Tailed Tests

.pull-left[

+ When evaluating evidence against `\(H_0\)`, our threshold for what values are considered to be *extreme* depends on whether we're running a one-tailed or two-tailed test.

]

---
### One-Tailed vs Two-Tailed Tests

.pull-left[

+ When evaluating evidence against the null hypothesis, our threshold for what values are considered to be *extreme* depends on whether we're running a one-tailed or two-tailed test.

+ With a **one-tailed test**, we're only interested in values in a single tail of a distribution

  + If `\(\alpha\)` is set at .05, we check that our observation is in the highest 5% of values *or* the lowest 5% of values

]

.pull-right[

![](IntroToNHST_lecture_files/figure-html/unnamed-chunk-37-1.svg)&lt;!-- --&gt;

.center[
&lt;b&gt;OR&lt;/b&gt;
]

![](IntroToNHST_lecture_files/figure-html/unnamed-chunk-38-1.svg)&lt;!-- --&gt;
]

---
### One-Tailed vs Two-Tailed Tests

.pull-left[

+ When evaluating evidence against the null hypothesis, our threshold for what values are considered to be *extreme* depends on whether we're running a one-tailed or two-tailed test.

+ With a **two-tailed test**, we're interested in values in both tails of a distribution

  + If `\(\alpha\)` is set at .05, we check that our observation is in the *most extreme* 5% of values, whether they are higher or lower
  
  + 5% is split equally between the two tails

]

.pull-right[

![](IntroToNHST_lecture_files/figure-html/unnamed-chunk-39-1.svg)&lt;!-- --&gt;

]

---
### Putting it Together

+ When we run a statistical test, our results are compared against the null distribution, which is the probability of the results given the null hypothesis is true.

+ If the probability of our outcome (the `\(p\)`-value) is less than the `\(\alpha\)` threshold, it means the outcome falls into the range that we've designated as extreme.

+ Because it's really unlikely that these results would occur if the null hypothesis were true, we consider this to be sufficient evidence against the null hypothesis, and we reject it.
